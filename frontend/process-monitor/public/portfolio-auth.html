<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HostLens Portfolio Auth</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #06101a;
        color: #e6eef8;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .status {
        display: grid;
        gap: 0.75rem;
        padding: 1.5rem 1.75rem;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        background: rgba(12, 20, 31, 0.88);
        box-shadow: 0 16px 48px rgba(0,0,0,0.3);
      }
      .label {
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #7de3c8;
      }
    </style>
  </head>
  <body>
    <div class="status">
      <div class="label">HostLens</div>
      <div id="message">Preparing authenticated portfolio view…</div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const access = params.get("access");
      const refresh = params.get("refresh");
      const redirect = params.get("redirect") || "/app";
      const message = document.getElementById("message");

      if (!access || !refresh) {
        message.textContent = "Missing portfolio credentials.";
      } else {
        window.localStorage.setItem("hostlens.access-token", access);
        window.localStorage.setItem("hostlens.refresh-token", refresh);
        message.textContent = "Credentials loaded. Redirecting…";
        window.location.replace(redirect);
      }
    </script>
  </body>
</html>
